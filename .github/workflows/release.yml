name: Release

# `rake release` pushes a vX.Y.Z tag. This tests the tag, then pushes the gem
# with trusted publishing: no token is stored. RELEASING.md has the one-time
# setup.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake release:versions
        env:
          TAG: ${{ github.ref_name }}

  ci:
    uses: ./.github/workflows/ci.yml

  gem:
    needs: [versions, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: bundle exec rake release:gem

  github-release:
    needs: [gem]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake release:notes > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
