name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs it on the tag before publishing
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec standardrb

  test:
    name: "Ruby (${{ matrix.database }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sossego_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # An empty DATABASE_URL makes Rails abort, so only set it for the postgres leg
      - if: matrix.database == 'postgres'
        run: echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/sossego_test" >> "$GITHUB_ENV"
      - run: cd test/dummy && RAILS_ENV=test bin/rails db:schema:load
      - run: bundle exec rake test

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx vitest run
